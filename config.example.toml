# C01 の設定。~/.config/c01/config.toml に置く（このファイルは見本。書いた項目だけが効く）。
# 表（CSV・テキスト）を変えたあとは `c01 compile` を実行する。ibus は次にその入力欄へ移ったときに読み直す。

# 起動時のモード: direct（直接入力）/ kanji（漢字のみ）/ hanwa（和漢混淆）
mode = "hanwa"

# 首辞になる字の表（data/head/<名前>.csv）。倉頡表・追加字。左から順に優先される
head = ["cangjie5", "custom"]

# 尾辞（首辞のあとに続く仮名）の表（data/tail/<名前>.csv）。
# 片仮名の表（katakana-hepburn）にすると和漢混淆（片）になる
tail = "hiragana-hepburn"

# 単独で構成するもの（data/pure/<名前>.csv）。片仮名など。いつも最低優先度で並行変換される。z で絞り込める
pure = ["katakana-hepburn"]

# 複合首辞のリスト（data/compound/<名前>.txt）。熟語・送り仮名つきの語・首辞となる平仮名。左から順に優先される
# 和漢混淆（片）にするときは、`c01 kana` で片仮名にしたリストを置いて、ここに加える
compound = ["jukugo", "okurigana", "kana_head"]

# ワイルドカード（る* など）の展開表（data/wildcards/<名前>.csv）
wildcards = "default"

# 記号の表（data/symbols/<名前>.csv）
symbols = "default"

# 字種の絞り込み: all（全部）/ trad（繁体字）/ simp（簡体字）/ shin（新字体）
# trad・simp・shin を使うには、文字の分類表 variants を用意する（文字,分類 の CSV）
script = "all"
variants = ""

# 入力中の表示: latin（打った英字そのまま）/ map（preedit_map の表で置き換える。倉頡なら部首の文字）
preedit = "latin"
preedit_map = "cangjie5"

# エラー音（音声ファイルのパス）。空なら鳴らさない。pw-play / paplay / aplay / ffplay のどれかが要る
error_sound = ""

# 候補窓の1ページの件数（1〜10。数字キー 0〜9 が使える）
page_size = 10

# 首辞のあとに尾辞が続く候補で、1つの打鍵長につき出す字の最大数（全体が1字で読める候補には効かない）
max_split_kanji = 3

# モードを順に切り替えるキー
mode_keys = ["ctrl+shift+m"]
