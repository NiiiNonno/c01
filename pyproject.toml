[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "c01"
version = "0.1.0"
description = "C01: ローマ字かな入力と倉頡で漢字を統一入力する ibus 入力メソッド"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
c01 = "c01.cli:main"

[tool.setuptools]
packages = ["c01"]

[tool.setuptools.package-data]
c01 = ["data/**/*"]
